name: Atualizar canais do YouTube

on:
  schedule:
    - cron: "0 */6 * * *"     # de 6 em 6 horas
  workflow_dispatch:           # botão para correr à mão

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/gerar-youtube-lista.mjs
      - name: Guardar se houve alterações
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add canais-youtube.json
          git diff --staged --quiet || git commit -m "Atualizar canais-youtube.json"
          git push
